<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Take a quiet walk through Littleroot Town and Route 101 in this 3D exploration prototype.">
<title>Hoenn — A Place to Begin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16372d;color:#f8ebd1;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 20%,#426a4d 0,transparent 60%),linear-gradient(145deg,#1e4435,#102c29);transition:opacity .45s}article{width:min(520px,85vw);text-align:center}.eyebrow{font-size:12px;letter-spacing:.25em;color:#c6d7ac}.mark{width:64px;height:64px;margin:0 auto 32px;color:#e2c791}h1{font-family:Georgia,serif;font-size:clamp(38px,5vw,62px);font-weight:400;letter-spacing:-.045em;margin:18px 0}p{color:#c5d1c0;line-height:1.7;font-size:15px}progress{appearance:none;width:100%;height:4px;border:0;margin:28px 0 12px;background:#ffffff17;border-radius:4px}progress::-webkit-progress-bar{background:#ffffff17;border-radius:4px}progress::-webkit-progress-value{background:#dfc38c;border-radius:4px}progress::-moz-progress-bar{background:#dfc38c}.meta{display:flex;justify-content:space-between;font-size:12px;color:#b0c6b1}#error{display:none;border:1px solid #dfc38c55;padding:20px;margin-top:24px;color:#f7ddbd;text-align:left;white-space:pre-line;font-size:14px;line-height:1.6}button{border:0;border-radius:6px;padding:12px 20px;background:#e3c68b;color:#213d34;font:inherit;cursor:pointer}footer{position:absolute;bottom:28px;font-size:11px;letter-spacing:.06em;color:#99b19d}noscript{position:fixed;inset:0;padding:20vh 10vw;background:#16372d;z-index:10}
</style>
<meta name="theme-color" content="#183b30">
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Hoenn exploration game. WASD to move, Shift to run, mouse to look, Escape to pause.">Your browser needs WebGL 2 to explore this world.</canvas>
<div id="loading" role="status" aria-live="polite"><article>
<svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="29" stroke="currentColor" opacity=".4"/><path d="M32 6 39 28 58 32 39 36 32 58 25 36 6 32 25 28Z" stroke="currentColor"/><path d="m32 15 5 17-5 17-5-17Z" fill="currentColor"/></svg>
<div class="eyebrow">A SMALL JOURNEY THROUGH HOENN</div><h1>A place to begin.</h1>
<p>A village tucked between the trees.<br>A trail waiting just beyond it.</p>
<progress id="progress" max="100"></progress><div class="meta"><span id="stage">Preparing your journey</span><span id="percent">Loading…</span></div>
<div id="error"></div>
</article><footer>LITTLEROOT TOWN &nbsp; / &nbsp; ROUTE 101</footer></div>
<noscript>JavaScript must be enabled to explore the map.</noscript>
<script src="index.js"></script>
<script>
const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47004340,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(config);
const loading = document.getElementById('loading');
function fail(error) {
  console.error(error);
  document.getElementById('stage').textContent='Unable to start';
  document.getElementById('percent').textContent='';
  const box=document.getElementById('error');box.style.display='block';
  box.textContent='The map could not load. Try a current desktop Chrome, Edge or Firefox with hardware acceleration enabled.\n\n'+String(error.message||error)+'\n\n';
  const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=()=>location.reload();box.appendChild(retry);
}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length)fail('Missing browser support: '+missing.join(', '));
else engine.startGame({
  onProgress(current,total){
    const progress=document.getElementById('progress');
    if(total>0){progress.value=current;progress.max=total;document.getElementById('percent').textContent=Math.round(current/total*100)+'%';}
    document.getElementById('stage').textContent=total>0&&current>=total?'Opening the forest…':'Loading the village and trail';
  }
}).then(()=>{loading.style.opacity='0';setTimeout(()=>loading.remove(),450);}).catch(fail);
</script>
</body>
</html>
